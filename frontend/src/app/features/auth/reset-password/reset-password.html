<div class="auth-page"><div class="auth-card">
  @if (done) {
    <div class="auth-header"><div class="logo">✅</div><h1>Password changed!</h1><p>You will be redirected to login…</p></div>
  } @else {
    <div class="auth-header"><div class="logo">🔑</div><h1>Set new password</h1></div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field"><label>New password</label><input type="password" formControlName="newPassword" placeholder="8 characters at least" /><span class="err" *ngIf="f['newPassword'].invalid && f['newPassword'].touched">8 characters at least</span></div>
      <div class="field"><label>Confirm password</label><input type="password" formControlName="confirmPassword" placeholder="Retype" /><span class="err" *ngIf="form.errors?.['mismatch'] && f['confirmPassword'].touched">Passwords do not match</span></div>
      <button type="submit" class="btn-submit" [disabled]="loading">{{ loading ? 'Saving…' : 'Save password' }}</button>
    </form>
  }
</div></div>
