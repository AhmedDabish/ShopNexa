<div class="auth-page"><div class="auth-card">
  @if (sent) {
    <div class="auth-header"><div class="logo">📧</div><h1>Sent</h1><p>If the email exists, you will receive a reset link</p></div>
    <a routerLink="/auth/login" class="btn-submit" style="display:block;text-align:center;text-decoration:none;">Back to login</a>
  } @else {
    <div class="auth-header"><div class="logo">🔒</div><h1>Forgot password?</h1><p>Enter your email and we'll send you a reset link</p></div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field"><label>Email</label><input type="email" formControlName="email" placeholder="example@email.com" /></div>
      <button type="submit" class="btn-submit" [disabled]="loading">{{ loading ? 'Sending…' : 'Send reset link' }}</button>
    </form>
    <p class="switch"><a routerLink="/auth/login">← Back to login</a></p>
  }
</div></div>
